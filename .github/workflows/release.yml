name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create semantic GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npx --yes
          --package=semantic-release
          --package=@semantic-release/changelog
          --package=@semantic-release/git
          semantic-release
