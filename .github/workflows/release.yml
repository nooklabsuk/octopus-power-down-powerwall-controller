name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - id: release-before
        name: Record latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')" >> "$GITHUB_OUTPUT"

      - name: Create semantic GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npx --yes
          --package=semantic-release
          --package=@semantic-release/changelog
          --package=@semantic-release/git
          semantic-release

      - id: release-after
        name: Read latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.release-after.outputs.tag != '' && steps.release-after.outputs.tag != steps.release-before.outputs.tag

      - uses: docker/setup-buildx-action@v3
        if: steps.release-after.outputs.tag != '' && steps.release-after.outputs.tag != steps.release-before.outputs.tag

      - uses: docker/login-action@v3
        if: steps.release-after.outputs.tag != '' && steps.release-after.outputs.tag != steps.release-before.outputs.tag
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: image-metadata
        uses: docker/metadata-action@v5
        if: steps.release-after.outputs.tag != '' && steps.release-after.outputs.tag != steps.release-before.outputs.tag
        with:
          images: ghcr.io/nooklabsuk/octopus-power-down-powerwall-controller
          tags: |
            type=raw,value=${{ steps.release-after.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        if: steps.release-after.outputs.tag != '' && steps.release-after.outputs.tag != steps.release-before.outputs.tag
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.release-after.outputs.tag }}
          tags: ${{ steps.image-metadata.outputs.tags }}
          labels: ${{ steps.image-metadata.outputs.labels }}
