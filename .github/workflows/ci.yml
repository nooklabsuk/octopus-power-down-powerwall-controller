name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Compile Python
        run: python -m py_compile controller.py emergency_restore.py

      - name: Build Docker image
        run: docker build --tag powerdown-controller:ci .

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
