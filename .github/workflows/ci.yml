name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Compile Python
        run: python -m py_compile controller.py emergency_restore.py tests/test_controller.py

      - name: Run unit tests with coverage
        run: |
          python -m pip install coverage
          coverage run --source=. -m unittest discover -s tests -t . -v
          coverage report --show-missing --fail-under=70
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build Docker image
        run: docker build --tag powerdown-controller:ci .

      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
