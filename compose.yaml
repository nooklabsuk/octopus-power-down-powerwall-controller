services:
  powerdown-controller:
    image: ghcr.io/nooklabsuk/octopus-power-down-powerwall-controller:${POWERDOWN_CONTROLLER_VERSION:?Set POWERDOWN_CONTROLLER_VERSION in .env}
    container_name: powerdown-controller
    env_file:
      - .env
    volumes:
      - ./state:/state
      - ./tariff:/tariff:ro
    restart: unless-stopped
